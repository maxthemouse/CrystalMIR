[project]
name = "crystalMIR"
version = "0.2.0"
description = "Analyze data using analyzer crystal."
authors = [{ name = "Adam Webb", email = "Adam.webb@lightsource.ca" }]
requires-python = ">=3.12"
readme = "README.md"
license = "BSD-3-Clause"
dependencies = [
    "tifffile>=2024.8.10,<2025",
    "scikit-image>=0.24.0,<0.25",
    "numpy>=2.0.1,<3",
    "scipy>=1.14.0,<2",
    "matplotlib>=3.9.2,<4",
    "pyprind>=2.11.3,<3",
    "nodejs>=0.1.1,<0.2",
    "jupyterlab>=4.4.8,<5",
    "jupyterlab-widgets>=3.0.11,<4",
    "ipywidgets>=8.1.3,<9",
    "numba>=0.60.0,<0.61",
    "xrt>=1.6.0,<2",
    "python-dotenv>=1.0.1,<2",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
line-ending = "auto"
